ui.info.title=Інфо та допомога
ui.info.subtitle=Короткий гід про трекінг із пріоритетом приватності, 24-годинний таймлайн, категорії програм і режим Pomodoro.
ui.info.privacy.title=Трекінг із пріоритетом приватності
ui.info.privacy.body=WorkPulseTracker фіксує, якими програмами ви користуєтесь і скільки часу — локально на вашому комп’ютері. Він не знімає натискання клавіш, скріншоти чи вміст файлів. Ви вирішуєте, що лишається локально, а що можна синхронізувати з акаунтом.
ui.info.timeline.title=Як читати 24-годинний таймлайн
ui.info.timeline.body=Таймлайн на вкладці Трекер — смуга за весь день від 00:00 до 24:00. Кольорові сегменти показують, що відбувалось; порожні проміжки означають, що ПК був вимкнений або нічого не трекалось.
ui.info.timeline.active.body=Зелений — продуктивний час у програмах із Track ON за наявності активності миші чи клавіатури.
ui.info.timeline.idle.body=Сірий — бездіяльність: довго не було вводу, або час у програмах-винятках, коли він рахується як Idle.
ui.info.timeline.excluded.body=Помаранчевий — програми з Track OFF (винятки), якщо увімкнено показ винятків на таймлайні.
ui.info.categories.title=Категорії програм
ui.info.categories.body=На вкладці Програми призначте додатки до Work, Communication, Training, Other або власних категорій. Track OFF — для особистих програм поза робочим підсумком. Категорії використовуються в діаграмі та статистиці.
ui.info.pomodoro.title=Режим Pomodoro
ui.info.pomodoro.body=На вкладці Pomodoro увімкніть таймер і задайте тривалість роботи та перерв. За бажанням увімкніть сповіщення в треї та діалоги підтвердження наприкінці фази. Pomodoro працює незалежно від трекінгу вікон.


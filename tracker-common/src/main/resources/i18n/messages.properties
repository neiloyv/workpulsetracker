ui.info.title=Info & Help
ui.info.subtitle=A short guide to privacy-first tracking, the 24-hour timeline, program categories, and Pomodoro.
ui.info.privacy.title=Privacy-first tracking
ui.info.privacy.body=WorkPulseTracker records which apps you use and for how long — locally on your computer. It does not capture keystrokes, screenshots, or file contents. You decide what stays local and what can sync to your account.
ui.info.timeline.title=How to read the 24h timeline
ui.info.timeline.body=The Tracker timeline is a full-day strip from 00:00 to 24:00. Colored segments show what was happening; empty gaps mean the PC was off or nothing was tracked.
ui.info.timeline.active.body=Green means productive time in Track ON apps with keyboard or mouse activity.
ui.info.timeline.idle.body=Gray means inactivity — no input for a while, or exception apps when they are counted as Idle.
ui.info.timeline.excluded.body=Orange marks Track OFF (exception) apps when the setting to show them on the timeline is enabled.
ui.info.categories.title=Program categories
ui.info.categories.body=Open the Programs tab to assign apps to Work, Communication, Training, Other, or your own categories. Use Track OFF for personal apps you want excluded from work totals. Categories power the chart and Statistics views.
ui.info.pomodoro.title=Pomodoro mode
ui.info.pomodoro.body=On the Pomodoro tab, enable the timer and set work/break lengths. Optional tray notifications and confirmation dialogs appear when a phase ends. Pomodoro runs independently from window tracking.


spring.application.name=tracker-server
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/workpulsetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:workpulsetracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:workpulsetracker}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public

app.ui-origin=${APP_UI_ORIGIN:http://localhost:5173}
app.download.windows-url=${DOWNLOAD_WINDOWS_URL:/downloads/workpulsetracker-agent-windows.msi}
app.download.macos-url=${DOWNLOAD_MACOS_URL:/downloads/workpulsetracker-agent-macos.dmg}
app.download.linux-url=${DOWNLOAD_LINUX_URL:/downloads/workpulsetracker-agent-linux.deb}
app.jwt.secret=${APP_JWT_SECRET:workpulsetracker-dev-jwt-secret-change-me-32b}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:2592000}

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.web.locale=en
spring.web.locale-resolver=accept-header

logging.level.org.springframework.security=INFO

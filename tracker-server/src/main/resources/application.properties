spring.application.name=tracker-server
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workpulsetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:workpulsetracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:workpulsetracker_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-me.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-me}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.ui-origin=${APP_UI_ORIGIN:http://localhost:5173}
app.download.windows-url=${DOWNLOAD_WINDOWS_URL:/downloads/workpulsetracker-agent-windows.msi}
app.download.macos-url=${DOWNLOAD_MACOS_URL:/downloads/workpulsetracker-agent-macos.dmg}
app.download.linux-url=${DOWNLOAD_LINUX_URL:/downloads/workpulsetracker-agent-linux.deb}

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.web.locale=en
spring.web.locale-resolver=accept-header

logging.level.org.springframework.security=INFO

databaseChangeLog:
  - changeSet:
      id: 001-init-schema
      author: workpulsetracker
      changes:
        - createTable:
            tableName: organization
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createTable:
            tableName: branch
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: branch
            baseColumnNames: organization_id
            referencedTableName: organization
            referencedColumnNames: id
            constraintName: fk_branch_organization
            onDelete: CASCADE

        - createTable:
            tableName: department
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: department
            baseColumnNames: branch_id
            referencedTableName: branch
            referencedColumnNames: id
            constraintName: fk_department_branch
            onDelete: CASCADE

        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(120)
              - column:
                  name: last_name
                  type: VARCHAR(120)
              - column:
                  name: phone
                  type: VARCHAR(64)
              - column:
                  name: account_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: UUID
              - column:
                  name: department_id
                  type: UUID
              - column:
                  name: agent_installed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: agent_version
                  type: VARCHAR(32)
              - column:
                  name: onboarded
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: app_user
            baseColumnNames: organization_id
            referencedTableName: organization
            referencedColumnNames: id
            constraintName: fk_app_user_organization

        - addForeignKeyConstraint:
            baseTableName: app_user
            baseColumnNames: branch_id
            referencedTableName: branch
            referencedColumnNames: id
            constraintName: fk_app_user_branch

        - addForeignKeyConstraint:
            baseTableName: app_user
            baseColumnNames: department_id
            referencedTableName: department
            referencedColumnNames: id
            constraintName: fk_app_user_department

        - sql:
            sql: CREATE UNIQUE INDEX ux_app_user_email ON app_user (LOWER(email));

        - createTable:
            tableName: agent_key
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: key_hash
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: key_prefix
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: agent_key
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_agent_key_user
            onDelete: CASCADE

        - createTable:
            tableName: organization_setting
            columns:
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: setting_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: setting_value
                  type: TEXT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: organization_setting
            columnNames: organization_id, setting_key
            constraintName: pk_organization_setting

        - addForeignKeyConstraint:
            baseTableName: organization_setting
            baseColumnNames: organization_id
            referencedTableName: organization
            referencedColumnNames: id
            constraintName: fk_organization_setting_organization
            onDelete: CASCADE

        - createTable:
            tableName: activity_sample
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: app_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: seconds
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: idle
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: activity_date
                  type: DATE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: activity_sample
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_activity_sample_user
            onDelete: CASCADE

        - createIndex:
            tableName: activity_sample
            indexName: ix_activity_sample_user_date
            columns:
              - column:
                  name: user_id
              - column:
                  name: activity_date

services:
  postgres:
    image: postgres:17-alpine
    container_name: workpulsetracker-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: workpulsetracker
      POSTGRES_USER: workpulsetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workpulsetracker_dev_password}
    volumes:
      - workpulsetracker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulsetracker -d workpulsetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workpulsetracker_pg_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: timetracker-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: timetracker
      POSTGRES_USER: timetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetracker_dev_password}
    volumes:
      - timetracker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker -d timetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timetracker_pg_data:
